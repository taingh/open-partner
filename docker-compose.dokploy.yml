services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openpartner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openpartner
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openpartner']
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://openpartner:${POSTGRES_PASSWORD}@postgres:5432/openpartner
      API_PORT: 4601
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      OPENPARTNER_MODE: selfhost
      OPENPARTNER_TENANCY: single
      OPENPARTNER_ENABLE_SCHEDULER: "1"
      PORTAL_URL: ${PORTAL_URL}
      METRICS_TOKEN: ${METRICS_TOKEN}
    expose:
      - '4601'

  router:
    build:
      context: .
      dockerfile: apps/router/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://openpartner:${POSTGRES_PASSWORD}@postgres:5432/openpartner
      ROUTER_PORT: 4701
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
    expose:
      - '4701'

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:4601
    expose:
      - '8080'

volumes:
  postgres-data:
